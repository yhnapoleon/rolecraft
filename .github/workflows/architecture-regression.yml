name: Architecture regression

# Core regression gate (lint delta, backend, frontend, 72 state checks, build,
# per-ID comparison) on every push to main and every pull request into main.
# Browser/MCP evidence still runs locally with CHROME_BIN; a pinned headless
# Chrome on the runner is required before enabling it here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --locked --python 3.12
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: uv run --locked python -m scripts.regression.run --output runs/local/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: |
            runs/local/ci/*.log
            runs/local/ci/backend.xml
            runs/local/ci/frontend.json
