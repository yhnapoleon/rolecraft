[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "career-lab"
version = "0.1.0"
description = "ISY5002 AI PM career task training environment"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic==2.12.5",
    "PyYAML==6.0.3",
    "scikit-learn>=1.5,<2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff>=0.16.10",
]

[project.scripts]
career-lab = "career_lab.cli:main"
career-lab-engineer = "career_lab.engineer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_cache/tmp"

# scripts/regression/lint.py applies these rules to added/changed Python code.
[tool.ruff]
target-version = "py311"
line-length = 100
# Frozen v1 contract sources: tests compare them byte-for-byte with commit 80cf1f6.
extend-exclude = [
    "src/career_lab/contracts/actions.py",
    "src/career_lab/contracts/base.py",
    "src/career_lab/contracts/deliverables.py",
    "src/career_lab/contracts/evaluation.py",
    "src/career_lab/contracts/scenario.py",
    # Rubric rule sources: installed evaluation bundles still bind these files' bytes
    # (rubric_v2.rules_document). Format them only after that binding moves to the
    # evaluation-version protocol through a formal rebind.
    "src/career_lab/rubrics/v4/rubric_v2.py",
    "src/career_lab/rubrics/v4/applicability.py",
    "src/career_lab/rubrics/v4/rules_v2.py",
    "src/career_lab/rubrics/v4/rules.py",
    "src/career_lab/rubrics/v4/feedback.py",
    "src/career_lab/rubrics/v4/judge.py",
    "src/career_lab/rubrics/v4/support.py",
    "src/career_lab/rubrics/v4/provider.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
