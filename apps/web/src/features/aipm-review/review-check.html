<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="data:,">
    <title>AIPM section review check</title>
  </head>
  <body style="margin:0;background:var(--canvas)">
    <main style="max-width:1320px;margin:0 auto;padding:24px 16px">
      <div id="fixture"></div>
    </main>
    <script type="module">
    // FIXTURE ONLY: a development page for screenshots; no session, server or model.
    import '@fontsource-variable/instrument-sans/wdth.css';
    import '@fontsource-variable/newsreader/opsz.css';
    import '../../app/styles.css';
    import '../../app/material.css';
    import { renderReview } from './view.ts';
    import { FIXTURE_PRD, fixtureModelReview, fixturePreview, fixtureReview } from './fixture.ts';

    const params = new URL(location.href).searchParams;
    // ?blocks=1: the section as the worksheet saves it, with a heading and a cited quote.
    const BLOCKS = {
      zh: '新员工反复来问报销和请假怎么办。\n\n### 这个数字怎么算出来的\n\n> elapsed_minutes = 从建单到结单的分钟数\n> — 《SD-120 字段说明》v1\n\n按平均 429 分钟一单，助手每单能为同事省下约 7 小时人工。这 429 分钟取自 SD-120 的 elapsed_minutes。首批 20 位新同事都会愿意先用助手再找人。下一步请 Chen 抽 10 单看实际处理时间。',
      en: 'New hires keep asking how expenses and leave work.\n\n### How this number is worked out\n\n> elapsed_minutes = minutes from opening to closing a ticket\n> — SD-120 field notes v1\n\nAt an average of 429 minutes a ticket, the assistant saves about 7 staff hours per ticket. The 429 minutes come from elapsed_minutes in SD-120. All 20 new hires in the first group will use the assistant before asking a person. Next, Chen samples 10 tickets for actual handling time.',
    };
    const language = params.get('lang') === 'en' ? 'en' : 'zh';
    const sentences =
      params.get('rec') === 'off'
        ? { kind: 'off' }
        : { kind: 'ready', preview: fixturePreview(language) };
    document.documentElement.lang = language;
    // ?model=not_configured|running|done|failed: the model look's states, on the same fake review.
    // Headless Chrome has no viewport under 500px; ?w=390 narrows the page itself.
    if (params.get('w'))
      Object.assign(document.querySelector('main').style, {
        width: `${params.get('w')}px`,
        margin: '0',
        boxSizing: 'border-box',
      });
    document.getElementById('fixture').append(
      renderReview(document, {
        review: params.get('model')
          ? fixtureModelReview(language, params.get('model'))
          : params.get('edited')
            ? { ...fixtureReview(language), stale: { reason: 'edited', detail: 'v4 -> v5' } }
            : fixtureReview(language),
        language,
        sections: params.get('blocks')
          ? { ...FIXTURE_PRD[language], need: BLOCKS[language] }
          : FIXTURE_PRD[language],
        sentences,
        previousVersion: 3,
      }),
    );
    if (params.get('probe')) {
      setTimeout(() => {
        const w = document.documentElement.clientWidth;
        const wide = [...document.querySelectorAll('*')]
          .filter((e) => e.getBoundingClientRect().right > w + 1)
          .map(
            (e) =>
              `${e.tagName}.${String(e.className).split(' ')[0]}:${Math.round(e.getBoundingClientRect().width)}`,
          );
        const pre = document.createElement('pre');
        pre.id = 'probe';
        pre.textContent = `vw=${w} sw=${document.documentElement.scrollWidth} ${wide.slice(0, 25).join(' | ')}`;
        document.body.prepend(pre);
      }, 1500);
    }
    </script>
  </body>
</html>
