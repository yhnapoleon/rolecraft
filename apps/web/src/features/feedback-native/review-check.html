<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/workbench.css"><link rel="icon" href="data:,"><title>W05 controlled review check</title></head><body><main style="max-width:780px;margin:24px auto;padding:16px"><p>Controlled component fixture — no real feedback or business session.</p><div id="fixture"></div></main><script type="module">
import {mountNativeFeedback} from './index.ts';
const language=new URL(location.href).searchParams.get('lang')||'zh';
const ref=(kind,id,version=1)=>({session_id:'fixture',kind,object_id:id,version});
const report={id:'feedback',version:1,subject:ref('review','old-review'),semantic_status:'waiting_for_model',items:[],business_response:language==='en'?'Recorded fixture; no semantic judgment.':'受控记录，未作语义判断。',next_options:[]};
const state={uiLanguage:language,workLanguage:language,products:[{session_id:'fixture',product_id:'note',version:2,title:language==='en'?'Investigation note':'调查笔记',author:{kind:'human',id:'learner'}}],reviews:[{id:'old-review',version:1,session_id:'fixture',subjects:[ref('product','note',1)],purpose:'exploration',question:language==='en'?'Earlier question':'此前的问题',decision:null,followup_of:[]}],reviewHistoryAvailable:true,reports:[report],responses:[{id:'response',version:1,session_id:'fixture',feedback:ref('feedback','feedback'),kind:'supplement',text:language==='en'?'A new reference, not yet verified':'新依据，仍待核验'}],status:'active',busy:false,semanticStatus:'waiting_for_model'};
const listeners=new Set();const calls=[];let mounted;const draftKey='w05-controlled-review:'+language;
const adapter={snapshot:()=>state,subscribe:fn=>{listeners.add(fn);return()=>listeners.delete(fn)},review:async input=>{calls.push({operation:'reviews.create',input});},submit:async()=>{throw Error('not part of this check')},respond:async()=>{},beginRevision:async()=>{},refresh:async()=>{},openReference:ref=>calls.push({operation:'openReference',ref}),readDraft:key=>JSON.parse(localStorage.getItem(draftKey+key)||'null')||undefined,keepDraft:async(key,value)=>localStorage.setItem(draftKey+key,JSON.stringify(value)),canReview:true,canRespond:true};
window.fixture={state,calls,remount:()=>{mounted?.destroy();mounted=mountNativeFeedback(document.querySelector('#fixture'),adapter,{surface:'feedback'});},update:()=>listeners.forEach(fn=>fn())};window.fixture.remount();
</script></body></html>
