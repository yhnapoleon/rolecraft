services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: career_lab
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: career_lab
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - career_lab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_lab"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  career_lab_pg:
