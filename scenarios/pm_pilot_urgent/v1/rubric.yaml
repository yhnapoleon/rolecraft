id: pm_pilot_rubric
version: 1
dimensions:
  - {id: R1, name: 目标与范围, weight: 10}
  - {id: R2, name: 证据与判断, weight: 25}
  - {id: R3, name: 约束与可行性, weight: 20}
  - {id: R4, name: 测试与验收, weight: 20}
  - {id: R5, name: 变化后的调整, weight: 15}
  - {id: R6, name: 可执行交付, weight: 10}
criteria:
  - id: R1.target
    version: 1
    dimension: R1
    description: 定义可服务的试点用户组与业务目标
    applicability: 所有提交
    observation_window: session_start_to_submission
    met: [用户组明确，业务目标对应实际咨询需求]
    partial: [只有用户组或目标之一明确]
    not_met: [完整提交中两者均未定义，或拒绝全部任务]
    insufficient: [提交记录丢失]
    accepted_alternatives: [仅服务稳定FAQ的首期试点也可达标]
    evidence_types: [plan_span, pilot_config]
  - id: R1.metrics
    version: 1
    dimension: R1
    description: 为业务目标定义可观察的成功指标
    applicability: 存在试点计划
    observation_window: session_start_to_submission
    met: [指标有定义、统计口径与目标条件]
    partial: [有指标名但缺少口径或目标条件]
    not_met: [完整成果中没有可观察指标]
    insufficient: [成果记录损坏]
    accepted_alternatives: [人工核验的有效解答率或错误政策回答数量均可作为指标]
    evidence_types: [plan_span]
  - id: R2.support
    version: 1
    dimension: R2
    description: 关键事实判断有当时可获得的材料支持
    applicability: 提交包含事实判断
    observation_window: as_of_judgment
    met: [关键判断可以定位到对应版本的充分证据]
    partial: [部分关键判断有证据，其他判断尚未核验]
    not_met: [关键判断与当时可获得的权威证据明确矛盾]
    insufficient: [所需版本或交互日志缺失]
    accepted_alternatives: [材料阅读、可靠角色引用与实际工具记录均可提供证据]
    evidence_types: [document_version, event, test_result, plan_span]
    forbidden_shortcuts: [不能用未来信息追罚先前合理判断]
  - id: R2.unknowns
    version: 1
    dimension: R2
    description: 对未证实的结论保留不确定性
    applicability: 方案涉及尚未证实的收益或批准
    observation_window: as_of_judgment
    met: [明确区分已知事实与待验证假设]
    partial: [承认不确定性但部分结论仍无条件表述]
    not_met: [将尚未批准的资源或未测试收益当成确定事实]
    insufficient: [缺少判断时可获得的信息记录]
    accepted_alternatives: [可以提出有检验方法的积极假设]
    evidence_types: [plan_span, event]
  - id: R3.capacity
    version: 1
    dimension: R3
    description: 试点人数不超过提交时获批上限
    applicability: 存在试点计划
    observation_window: session_start_to_submission
    met: [人数不超过30，或不超过有效扩容批准后的上限]
    partial: [方案人数与配置不一致但都未超限]
    not_met: [人数超过有效上限且无覆盖该人数的批准]
    insufficient: [批准登记册或人数配置缺失]
    accepted_alternatives: [减少人数或先取得扩容批准均可]
    evidence_types: [pilot_config, event, plan_span]
    forbidden_shortcuts: [不能把申请或口头计划当作已生效批准]
  - id: R3.resources
    version: 1
    dimension: R3
    description: 实现配置所需工作项在有效资源和期限内可完成
    applicability: 存在试点计划
    observation_window: session_start_to_submission
    met: [工作项覆盖配置依赖，总成本与上线日满足有效批准]
    partial: [成本未超限但部分依赖描述不完整]
    not_met: [超预算、超期限或遗漏实现所必需工作项]
    insufficient: [工作项、批准或配置记录损坏]
    accepted_alternatives: [稳定FAQ范围过滤加人工fallback共2人日, 实时同步加人工fallback共6人日，获批后第10天开放]
    evidence_types: [pilot_config, plan_span, event, document_version]
  - id: R4.functional_tests
    version: 1
    dimension: R4
    description: 通过实际测试验证正常问题和范围外请求
    applicability: 存在知识助手配置
    observation_window: session_start_to_submission
    met: [两类测试均有实际记录，包含结果与验收标准]
    partial: [只有一类实际测试或缺少验收标准]
    not_met: [日志完整且没有实际测试]
    insufficient: [系统故障导致测试日志缺失]
    accepted_alternatives: [不同表达的正常问题和范围外问题均可]
    evidence_types: [test_result, pilot_config, plan_span]
    forbidden_shortcuts: [声称已充分测试不能替代实际记录]
  - id: R4.staleness_test
    version: 1
    dimension: R4
    description: 验证动态知识更新后助手的回答表现
    applicability: 试点开放动态知识回答；排除该领域或政策全转人工时可不适用
    observation_window: session_start_to_submission
    met: [更新后有实际测试，可定位源与索引版本，方案响应了结果或有证据说明无需调整]
    partial: [有实际测试但未将结果用于相关决策]
    not_met: [日志完整且仍开放动态领域，却未验证更新后的回答]
    insufficient: [系统故障导致版本或测试记录缺失]
    accepted_alternatives: [排除动态知识域时由范围与可行性项评价]
    evidence_types: [test_result, document_version, pilot_config, plan_span]
    forbidden_shortcuts: [索引版本与源版本不得混为一谈]
  - id: R5.impact
    version: 1
    dimension: R5
    description: 识别已发生变化对当前方案的影响
    applicability: 任务中发生了对用户可获取的变化事件
    observation_window: session_start_to_submission
    met: [根据事件说明受影响范围或给出不受影响的充分理由]
    partial: [识别变化但影响分析不完整]
    not_met: [可见变化直接影响当前方案却仍坚持已失效事实]
    insufficient: [事件可见性或交互记录缺失]
    accepted_alternatives: [仅开放稳定FAQ时可说明政策变化不影响范围]
    evidence_types: [event, plan_span, pilot_config]
  - id: R5.adjustment
    version: 1
    dimension: R5
    description: 落实必要的方案或配置调整
    applicability: 可见变化事件使当前方案需要调整；否则可不适用
    observation_window: session_start_to_submission
    met: [方案与配置已经落实必要调整并有版本记录]
    partial: [提出可行调整但配置尚未同步]
    not_met: [已明确需要调整且记录完整，却未采取有效措施]
    insufficient: [配置历史或成果版本缺失]
    accepted_alternatives: [缩小范围、转人工或验证同步后继续开放]
    evidence_types: [pilot_config, event, plan_span, test_result]
    forbidden_shortcuts: [未受影响的方案无需为了得分强行改写]
  - id: R6.consistency
    version: 1
    dimension: R6
    description: 最终方案和实际配置保持一致
    applicability: 所有提交
    observation_window: session_start_to_submission
    met: [人数、知识范围、更新策略与fallback均与提交配置一致]
    partial: [仅非关键说明存在不一致]
    not_met: [关键配置与方案冲突或完整日志确认没有交付]
    insufficient: [成果或配置版本无法读取]
    accepted_alternatives: [结构化配置可以替代重复文案]
    evidence_types: [pilot_config, plan_span]
  - id: R6.operations
    version: 1
    dimension: R6
    description: 定义试点观察与退出安排
    applicability: 存在试点计划
    observation_window: session_start_to_submission
    met: [有负责人、观察窗口、退出条件和对应执行动作]
    partial: [存在执行安排但缺少部分必要条件]
    not_met: [完整交付中没有可执行的观察或退出安排]
    insufficient: [交付记录缺失或损坏]
    accepted_alternatives: [可按错误回答阈值或服务异常设置退出条件]
    evidence_types: [plan_span]
